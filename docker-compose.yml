version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: portal-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - portal-net

  app:
    build: ./app
    container_name: portal-app
    restart: always
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@portal-db:${DB_PORT}/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./app/public/uploads:/app/public/uploads
    networks:
      - portal-net

  nginx:
    image: nginx:alpine
    container_name: portal-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./app/public/uploads:/app/public/uploads
    depends_on:
      - app
    networks:
      - portal-net

volumes:
  pgdata:

networks:
  portal-net:
    driver: bridge